name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Linux (always builds) ────────────────────────────────────
  build-linux:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm 2>/dev/null || true
      - name: Install dependencies
        run: npm ci
      - name: Bundle CodeMirror
        run: npm run bundle:codemirror
      - name: Build
        run: npx electron-builder --linux AppImage deb rpm freebsd --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: List build artifacts
        run: ls -lh dist/ 2>/dev/null || true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.freebsd
            dist/latest-linux*.yml
          if-no-files-found: error
          retention-days: 7

  # ── Windows (tag pushes only) ────────────────────────────────
  build-win:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !cancelled() }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Bundle CodeMirror
        run: npm run bundle:codemirror
      - name: Build
        run: npx electron-builder --win nsis portable --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: List build artifacts
        run: Get-ChildItem dist/ -Recurse | Select-Object Length,Name
        shell: pwsh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-win
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.portable.exe
            dist/latest.yml
          if-no-files-found: error
          retention-days: 7

  # ── macOS Intel (tag pushes only) ────────────────────────────
  build-mac-x64:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !cancelled() }}
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Bundle CodeMirror
        run: npm run bundle:codemirror
      - name: Build (unsigned)
        run: |
          cat > ./ci-mac-override.yml << 'EOF'
          mac:
            hardenedRuntime: false
            notarize: false
          EOF
          npx electron-builder --mac --x64 --publish never --config ./ci-mac-override.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: List build artifacts
        run: ls -lh dist/ 2>/dev/null || true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-mac-x64
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

  # ── macOS ARM (tag pushes only) ──────────────────────────────
  build-mac-arm64:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !cancelled() }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Bundle CodeMirror
        run: npm run bundle:codemirror
      - name: Build (unsigned)
        run: |
          cat > ./ci-mac-override.yml << 'EOF'
          mac:
            hardenedRuntime: false
            notarize: false
          EOF
          npx electron-builder --mac --arm64 --publish never --config ./ci-mac-override.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: List build artifacts
        run: ls -lh dist/ 2>/dev/null || true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-mac-arm64
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

  # ── Publish (tag pushes only, after all builds) ──────────────
  publish:
    needs:
      - build-linux
      - build-win
      - build-mac-x64
      - build-mac-arm64
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts for release
        run: |
          echo "=== All release artifacts ==="
          ls -lh dist/ 2>/dev/null
          find dist/ -type f | sort
      - name: Create GitHub release (draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "${GITHUB_REF_NAME#v}" \
            --notes "See [CHANGELOG](./CHANGELOG.md) for details." \
            dist/*
